name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build API-specific JARs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Install YAML validator
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Build API-specific JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          build() {
            suffix="$1"
            api_line="$2"
            mvn --batch-mode --no-transfer-progress clean package               -Dplugin.api.version="$api_line"               -Djar.suffix="$suffix"
            cp "target/VoxelDevelopment-1.0-SNAPSHOT-$suffix.jar"                "dist/VoxelDevelopment-$suffix.jar"
          }

          build "legacy-1.12" ""
          build "1.13" "api-version: '1.13'"
          build "1.14" "api-version: '1.14'"
          build "1.15" "api-version: '1.15'"
          build "1.16" "api-version: '1.16'"
          build "1.17" "api-version: '1.17'"
          build "1.18" "api-version: '1.18'"
          build "1.19" "api-version: '1.19'"
          build "1.20" "api-version: '1.20'"
          build "1.21" "api-version: '1.21'"
          build "1.22" "api-version: '1.22'"
          build "1.23" "api-version: '1.23'"
          build "1.24" "api-version: '1.24'"
          build "1.25" "api-version: '1.25'"
          build "26.1" "api-version: '26.1'"
          build "26.2" "api-version: '26.2'"

      - name: Validate generated descriptors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, yaml

          expected = {
              "legacy-1.12": None,
              "1.13": "1.13", "1.14": "1.14", "1.15": "1.15",
              "1.16": "1.16", "1.17": "1.17", "1.18": "1.18",
              "1.19": "1.19", "1.20": "1.20", "1.21": "1.21",
              "1.22": "1.22", "1.23": "1.23", "1.24": "1.24",
              "1.25": "1.25", "26.1": "26.1", "26.2": "26.2",
          }

          for suffix, api in expected.items():
              jar = f"dist/VoxelDevelopment-{suffix}.jar"
              with zipfile.ZipFile(jar) as zf:
                  parsed = yaml.safe_load(zf.read("plugin.yml").decode("utf-8"))
              if parsed.get("name") != "VoxelDevelopment":
                  raise SystemExit(f"{jar}: invalid plugin name")
              if api is None:
                  if "api-version" in parsed:
                      raise SystemExit(f"{jar}: legacy build must omit api-version")
              elif str(parsed.get("api-version")) != api:
                  raise SystemExit(
                      f"{jar}: expected api-version {api}, got {parsed.get('api-version')}"
                  )
              print(f"{jar}: plugin.yml valid (api-version={api or 'legacy'})")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelDevelopment
          path: dist/*.jar
          if-no-files-found: error

      - name: Publish rolling latest prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/*.jar --clobber
            gh release edit latest               --title "Latest Development Build"               --notes "Automatically built API-specific VoxelDevelopment JARs. Choose the JAR matching your server version."               --prerelease
          else
            gh release create latest dist/*.jar               --title "Latest Development Build"               --notes "Automatically built from the latest commit on main."               --prerelease               --target "$GITHUB_SHA"
          fi

      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.jar             --title "$GITHUB_REF_NAME"             --generate-notes
